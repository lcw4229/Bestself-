<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FF SuperDB">
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="FF SuperDB">
<meta name="description" content="Fantasy Football Super Database — all your Sleeper &amp; ESPN leagues in one place.">
<title>FF SuperDB</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#191922;--bg4:#20202c;
  --border:#26263400;--border:#242432;--border2:#33334a;
  --text:#EAEAF2;--text2:#9a9ab0;--text3:#5a5a70;
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;--amber:#f59e0b;
  --accent:#16f2b3;--accent2:#7c5cff;--field:#0e2f1e;
  --qb:#f472b6;--rb:#34d399;--wr:#60a5fa;--te:#fbbf24;--k:#c084fc;--def:#f87171;
  --nav-h:58px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --radius:14px;--shadow:0 4px 24px rgba(0,0,0,.4);
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none}
input,select{font-family:inherit;font-size:16px}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:0;height:0}

/* Header */
#header{padding:calc(var(--safe-t) + 12px) 16px 12px;background:linear-gradient(180deg,#12121a,#0a0a0f);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
#header .logo{font-weight:800;font-size:19px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
#header .logo .mark{background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
#header .badge{margin-left:auto;font-size:11px;color:var(--text2);background:var(--bg3);
  padding:4px 9px;border-radius:20px;border:1px solid var(--border)}
#header .badge b{color:var(--accent)}

/* Main scroll area */
#main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:16px 16px calc(var(--nav-h) + var(--safe-b) + 20px)}

/* Bottom nav */
#nav{height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:rgba(12,12,18,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border);display:flex;flex-shrink:0}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--text3);font-size:10px;font-weight:600;transition:color .15s}
#nav button.active{color:var(--accent)}
#nav button svg{width:22px;height:22px;stroke-width:2}

/* Cards & bits */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:14px}
.card h2,.section-title{font-size:13px;text-transform:uppercase;letter-spacing:1px;
  color:var(--text2);font-weight:700;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--text2)}.dim{color:var(--text3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:20px;background:var(--bg3);border:1px solid var(--border)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.stat .n{font-size:24px;font-weight:800;letter-spacing:-.5px}
.stat .l{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--bg4);flex-shrink:0;object-fit:cover;
  border:1px solid var(--border2);display:inline-block}
.avatar.sm{width:24px;height:24px}.avatar.lg{width:44px;height:44px}
.btn{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:11px 14px;
  font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:linear-gradient(135deg,var(--accent),#0fcf9a);color:#04120c;border:none}
.btn.wide{width:100%}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent}
.pos{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;color:#04120c;min-width:30px;text-align:center;display:inline-block}
.pos.QB{background:var(--qb)}.pos.RB{background:var(--rb)}.pos.WR{background:var(--wr)}
.pos.TE{background:var(--te)}.pos.K{background:var(--k)}.pos.DEF{background:var(--def)}
.pos.FLEX,.pos.SUPER_FLEX,.pos.WRRB_FLEX,.pos.REC_FLEX{background:#94a3b8}
.pos.BN,.pos.IR,.pos.TAXI{background:#3a3a4a;color:var(--text2)}
input.field,select.field{width:100%;background:var(--bg3);border:1px solid var(--border2);
  border-radius:10px;padding:12px;color:var(--text);margin-top:6px}
label.lbl{font-size:12px;color:var(--text2);font-weight:600;display:block;margin-top:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{white-space:nowrap;font-size:13px;font-weight:600;padding:8px 14px;border-radius:20px;
  background:var(--bg2);border:1px solid var(--border);color:var(--text2)}
.tabs button.active{background:var(--accent);color:#04120c;border-color:transparent}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px}
.tag.sleeper{background:rgba(124,92,255,.18);color:#b4a4ff;border:1px solid rgba(124,92,255,.3)}
.tag.espn{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.empty{text-align:center;padding:50px 20px;color:var(--text3)}
.empty svg{width:52px;height:52px;stroke-width:1.5;margin-bottom:14px;opacity:.5}
.spinner{width:26px;height:26px;border:3px solid var(--border2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.list-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.grow{flex:1;min-width:0}
.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win{color:var(--green)}.loss{color:var(--red)}
.bar{height:6px;border-radius:4px;background:var(--bg4);overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.chip{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-weight:600}
.inj{color:var(--red);font-size:10px;font-weight:800;border:1px solid var(--red);border-radius:5px;padding:1px 4px}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px;
  background:var(--bg3);border-radius:12px;margin-bottom:8px}
.matchup .side{display:flex;align-items:center;gap:8px;min-width:0}
.matchup .side.r{justify-content:flex-end;text-align:right}
.matchup .score{font-size:20px;font-weight:800;letter-spacing:-.5px}
.matchup .vs{font-size:11px;color:var(--text3);font-weight:700;text-align:center}
.trend-up{color:var(--green);font-weight:700}.trend-down{color:var(--red);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
  background:var(--bg4);border:1px solid var(--border2);color:var(--text);padding:12px 18px;border-radius:12px;
  font-size:14px;font-weight:600;z-index:100;box-shadow:var(--shadow);max-width:88%;text-align:center}
.warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fcd34d;
  border-radius:10px;padding:12px;font-size:13px;line-height:1.5;margin-top:10px}
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text3)}
.search-wrap input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:12px 12px 12px 40px;color:var(--text)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;
  backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-height:86vh;overflow-y:auto;
  padding:20px 18px calc(var(--safe-b) + 24px);border-top:1px solid var(--border2);animation:slideup .25s ease}
@keyframes slideup{from{transform:translateY(100%)}}
.modal .handle{width:40px;height:4px;background:var(--border2);border-radius:3px;margin:0 auto 16px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.kv:last-child{border:none}.kv .k{color:var(--text2)}
.fade{animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="logo"><span class="mark">🏈 FF SuperDB</span></div>
    <div class="badge" id="stateBadge">—</div>
  </div>
  <div id="main"><div class="spinner"></div></div>
  <nav id="nav">
    <button data-view="dashboard" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      Dashboard</button>
    <button data-view="week">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14l2.5 2.5L16 12"/></svg>
      This Week</button>
    <button data-view="leagues">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9h12M6 15h12M9 3v18M15 3v18"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      Leagues</button>
    <button data-view="players">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      Players</button>
    <button data-view="dynasty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l2.4 5 5.6.8-4 4 1 5.6L12 20l-5 2.6 1-5.6-4-4 5.6-.8z"/></svg>
      Draft Kit</button>
    <button data-view="trending">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 3h4v4"/></svg>
      Trending</button>
    <button data-view="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Settings</button>
  </nav>
</div>

<script>
"use strict";
/* ============================================================
   FF SuperDB — single-file PWA
   Primary source: Sleeper (public read API, no key).
   Secondary: ESPN Fantasy (public leagues + manual import).
   All data cached client-side (localStorage + IndexedDB).
   ============================================================ */

const SLEEPER = "https://api.sleeper.app/v1";
const SLEEPER_CDN = "https://sleepercdn.com";
const ESPN_BASE = "https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl";

/* ---------- tiny helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const el = (t, c, h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num = (n,d=2) => (n==null||isNaN(n))?"—":Number(n).toFixed(d);
const main = $("#main");

function toast(msg, ms=2200){
  const t = el("div","toast",esc(msg)); document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(()=>t.remove(),300);},ms);
}

/* ---------- persistent settings (localStorage) ---------- */
const CFG_KEY = "ffsuperdb.cfg.v1";
const cfg = Object.assign({
  sleeperUser:"landon2012", sleeperUserId:"", season:"", trackedLeagues:[], // array of league_id strings
  espnLeagues:[],  // [{leagueId, season, name, swid, s2, manualJson}]
  mode:"dynasty",  // "dynasty" | "redraft" — drives the Draft Kit data source
  draftId:"",      // Sleeper draft_id being followed live
  espnRanksRaw:"", // pasted ESPN ranks (for the Sleeper-vs-ESPN gap view)
}, JSON.parse(localStorage.getItem(CFG_KEY) || "{}"));
function saveCfg(){ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }

/* ---------- lightweight cache (localStorage, TTL) ---------- */
function cacheGet(key, maxAgeMs){
  try{ const o=JSON.parse(localStorage.getItem("ffcache."+key)); if(!o)return null;
    if(maxAgeMs && Date.now()-o.t>maxAgeMs) return null; return o.v; }catch(e){return null;}
}
function cacheSet(key, v){ try{ localStorage.setItem("ffcache."+key, JSON.stringify({t:Date.now(),v})); }catch(e){} }

/* ---------- IndexedDB for the big player DB (~5MB) ---------- */
const IDB = (()=>{
  let dbp;
  function open(){ return dbp || (dbp = new Promise((res,rej)=>{
    const r = indexedDB.open("ffsuperdb",1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("kv");
    r.onsuccess = ()=> res(r.result); r.onerror = ()=> rej(r.error);
  })); }
  return {
    async get(k){ const db=await open(); return new Promise((res,rej)=>{
      const t=db.transaction("kv").objectStore("kv").get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); },
    async set(k,v){ const db=await open(); return new Promise((res,rej)=>{
      const t=db.transaction("kv","readwrite").objectStore("kv").put(v,k); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); },
  };
})();

/* ---------- fetch with graceful errors ---------- */
async function jget(url, opts){
  const r = await fetch(url, opts);
  if(!r.ok) throw new Error("HTTP "+r.status+" for "+url);
  return r.json();
}

/* ============================================================
   Sleeper API layer
   ============================================================ */
const Sleeper = {
  async state(){ return cacheGet("state",3600e3) || cacheSet("state", await jget(`${SLEEPER}/state/nfl`)) || cacheGet("state"); },
  async user(name){ return jget(`${SLEEPER}/user/${encodeURIComponent(name)}`); },
  async leagues(userId, season){ return jget(`${SLEEPER}/user/${userId}/leagues/nfl/${season}`); },
  async league(id){ return jget(`${SLEEPER}/league/${id}`); },
  async leagueUsers(id){ return jget(`${SLEEPER}/league/${id}/users`); },
  async rosters(id){ return jget(`${SLEEPER}/league/${id}/rosters`); },
  async matchups(id, wk){ return jget(`${SLEEPER}/league/${id}/matchups/${wk}`); },
  async transactions(id, wk){ return jget(`${SLEEPER}/league/${id}/transactions/${wk}`); },
  async trending(type, hrs=24, limit=25){ return jget(`${SLEEPER}/players/nfl/trending/${type}?lookback_hours=${hrs}&limit=${limit}`); },
  async userDrafts(userId, season){ return jget(`${SLEEPER}/user/${userId}/drafts/nfl/${season}`); },
  async leagueDrafts(leagueId){ return jget(`${SLEEPER}/league/${leagueId}/drafts`); },
  async draft(id){ return jget(`${SLEEPER}/draft/${id}`); },
  async draftPicks(id){ return jget(`${SLEEPER}/draft/${id}/picks`); },
  async allPlayers(force){
    const meta = cacheGet("playersMeta", null);
    if(!force && meta && Date.now()-meta.t < 24*3600e3){
      const p = await IDB.get("players"); if(p) return p;
    }
    const p = await jget(`${SLEEPER}/players/nfl`);
    await IDB.set("players", p);
    cacheSet("playersMeta", {t:Date.now(), count:Object.keys(p).length});
    return p;
  },
  userAvatar(a){ return a ? `${SLEEPER_CDN}/avatars/thumbs/${a}` : ""; },
  leagueAvatar(a){ return a ? `${SLEEPER_CDN}/avatars/thumbs/${a}` : ""; },
  playerImg(id){ return `${SLEEPER_CDN}/content/nfl/players/thumb/${id}.jpg`; },
};

/* ============================================================
   ESPN API layer (public leagues; private need manual import)
   ============================================================ */
const Espn = {
  async league(leagueId, season, opts={}){
    const url = `${ESPN_BASE}/seasons/${season}/segments/0/leagues/${leagueId}`+
      `?view=mTeam&view=mRoster&view=mMatchup&view=mSettings&view=mStandings`;
    const init = {};
    if(opts.swid && opts.s2){ init.credentials = "include"; } // best-effort; browser may block
    return jget(url, init);
  }
};

/* ============================================================
   In-memory app state
   ============================================================ */
const APP = {
  view:"dashboard", state:null, players:null, playersLoaded:false,
  leagues:{}, // league_id -> {info,users,rosters,matchups,source}
  espn:{},    // leagueId -> parsed
};

/* Resolve a Sleeper player_id to a display object */
function P(id){
  const p = APP.players && APP.players[id];
  if(!p){ // DEF teams come as e.g. "SF"
    if(typeof id==="string" && id.length<=3 && /^[A-Z]+$/.test(id))
      return {name:id, pos:"DEF", team:id, id};
    return {name:id||"—", pos:"", team:"", id};
  }
  return {
    name: p.full_name || `${p.first_name||""} ${p.last_name||""}`.trim() || p.last_name || id,
    pos: p.position || (p.fantasy_positions&&p.fantasy_positions[0]) || "",
    team: p.team || "FA", id,
    inj: p.injury_status || "", status: p.status || "",
    age: p.age, num: p.number, exp: p.years_exp, raw:p
  };
}

/* ============================================================
   Router / nav
   ============================================================ */
const VIEWS = {};
function clearDraftTimer(){ if(APP.draftTimer){ clearInterval(APP.draftTimer); APP.draftTimer=null; } }
function openBoardPlayer(p){ if(APP.playersLoaded && p.sleeperId) openPlayer(p.sleeperId); else openPlayerByName(p.name); }
function go(view){
  clearDraftTimer();
  APP.view = view;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active", b.dataset.view===view));
  main.scrollTop = 0;
  main.innerHTML = "";
  (VIEWS[view] || VIEWS.dashboard)();
}
document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.view)));

function loading(msg){ main.innerHTML = `<div class="spinner"></div><p class="empty" style="padding-top:0">${esc(msg||"Loading…")}</p>`; }
function emptyState(icon, title, sub, btn){
  const d = el("div","empty");
  d.innerHTML = `${icon}<div style="font-size:16px;color:var(--text2);font-weight:700">${esc(title)}</div>
    <div style="margin-top:6px;font-size:14px">${esc(sub||"")}</div>`;
  if(btn){ const b=el("button","btn primary",btn.label); b.style.marginTop="18px"; b.onclick=btn.onClick; d.appendChild(b); }
  return d;
}
const ICON = {
  db:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg>`,
  trophy:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9H4a2 2 0 01-2-2V5a2 2 0 012-2h2M18 9h2a2 2 0 002-2V5a2 2 0 00-2-2h-2M6 3h12v6a6 6 0 01-12 0V3zM9 21h6M12 15v6"/></svg>`,
  user:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>`,
};

/* ============================================================
   Data loaders (with caching)
   ============================================================ */
async function ensurePlayers(){
  if(APP.playersLoaded) return APP.players;
  APP.players = await Sleeper.allPlayers();
  APP.playersLoaded = true;
  return APP.players;
}

async function loadSleeperLeague(id, week){
  const [info, users, rosters, matchups] = await Promise.all([
    Sleeper.league(id).catch(()=>null),
    Sleeper.leagueUsers(id).catch(()=>[]),
    Sleeper.rosters(id).catch(()=>[]),
    week ? Sleeper.matchups(id, week).catch(()=>[]) : Promise.resolve([]),
  ]);
  const userMap = {}; (users||[]).forEach(u=>userMap[u.user_id]=u);
  const L = {source:"sleeper", id, info, users:users||[], userMap, rosters:rosters||[], matchups:matchups||[]};
  APP.leagues[id] = L;
  return L;
}

function rosterOwnerName(L, roster){
  const u = L.userMap[roster.owner_id];
  if(!u) return "Unknown";
  return (u.metadata && u.metadata.team_name) || u.display_name || u.username || "Team";
}
function rosterRecord(r){
  const s = r.settings||{};
  return {w:s.wins||0, l:s.losses||0, t:s.ties||0,
    pf:(s.fpts||0)+((s.fpts_decimal||0)/100), pa:(s.fpts_against||0)+((s.fpts_against_decimal||0)/100)};
}

/* Sleeper /state/nfl exposes BOTH `season` (last completed year during the
   offseason) and `league_season` (the upcoming year leagues are made for).
   Always drive league lookups off league_season so we land on 2026, not 2025. */
function curSeason(st){ return String((st && (st.league_season || st.season)) || new Date().getFullYear()); }

/* Reconcile tracked leagues to the current season once per session:
   keep any that are already current-season, and migrate prior-season picks
   forward via Sleeper's previous_league_id dynasty lineage (2025 -> 2026). */
async function ensureCurrentSeasonLeagues(season){
  if(!cfg.sleeperUserId || !cfg.trackedLeagues.length) return;
  if(APP._reconciledSeason===season) return;
  const cur = await Sleeper.leagues(cfg.sleeperUserId, season).catch(()=>[]);
  if(cur && cur.length){
    const ids = new Set(cur.map(l=>l.league_id));
    const prev = new Set(cfg.trackedLeagues);
    let next = cfg.trackedLeagues.filter(id=>ids.has(id));
    cur.forEach(l=>{ if(l.previous_league_id && prev.has(l.previous_league_id) && !next.includes(l.league_id)) next.push(l.league_id); });
    if(next.length){ cfg.trackedLeagues = next; cfg.season = season; cfg.leaguesSeason = season; saveCfg(); }
  }
  APP._reconciledSeason = season;
}

function myTeamsAcrossLeagues(){
  const out=[];
  cfg.trackedLeagues.forEach(id=>{
    const L=APP.leagues[id]; if(!L||!L.info) return;
    const r = L.rosters.find(r=> r.owner_id===cfg.sleeperUserId);
    if(!r) return;
    const rec = rosterRecord(r);
    // rank
    const sorted = [...L.rosters].sort((a,b)=>{ const A=rosterRecord(a),B=rosterRecord(b);
      return (B.w-B.l)-(A.w-A.l) || B.pf-A.pf; });
    const rank = sorted.findIndex(x=>x.roster_id===r.roster_id)+1;
    out.push({source:"sleeper", leagueId:id, leagueName:L.info.name, teamName:rosterOwnerName(L,r),
      rec, rank, rosterId:r.roster_id, players:r.players||[]});
  });
  cfg.espnLeagues.forEach(e=>{
    const d = APP.espn[e.leagueId]; if(!d||!d.myTeam) return;
    out.push({source:"espn", leagueId:e.leagueId, leagueName:d.name||e.name||("ESPN "+e.leagueId),
      teamName:d.myTeam.name, rec:d.myTeam.rec, rank:d.myTeam.rank, players:d.myTeam.playerIds||[]});
  });
  return out;
}

function myMatchup(L, rosterId){
  if(!L.matchups||!L.matchups.length) return null;
  const me = L.matchups.find(m=>m.roster_id===rosterId); if(!me) return null;
  const opp = L.matchups.find(m=>m.matchup_id===me.matchup_id && m.roster_id!==rosterId);
  return {me, opp};
}
function renderMatchupRow(L, mu, leagueName){
  const wrap = el("div");
  const meName = teamNameByRoster(L, mu.me.roster_id);
  const oppName = mu.opp ? teamNameByRoster(L, mu.opp.roster_id) : "BYE";
  const meP = mu.me.points||0, oppP = mu.opp? (mu.opp.points||0):0;
  const box = el("div","matchup");
  box.innerHTML = `
    <div class="side"><div class="grow"><div class="nowrap" style="font-weight:700;font-size:13px">${esc(meName)}</div>
      <div class="dim" style="font-size:10px">${esc(leagueName)}</div></div></div>
    <div><div class="score" style="text-align:center;color:${meP>=oppP?'var(--green)':'var(--text)'}">${num(meP,1)}</div>
      <div class="vs">vs</div></div>
    <div class="side r"><div class="grow"><div class="nowrap" style="font-weight:700;font-size:13px">${esc(oppName)}</div>
      <div class="score" style="text-align:right">${num(oppP,1)}</div></div></div>`;
  wrap.appendChild(box);
  return wrap;
}
function teamNameByRoster(L, rid){
  const r = L.rosters.find(r=>r.roster_id===rid); if(!r) return "Team "+rid;
  return rosterOwnerName(L, r);
}

/* Cross-league exposure: which players do I roster in multiple leagues */
function exposureCard(mine){
  const card = el("div","card");
  card.appendChild(el("h2",null,"Player Exposure (across all leagues)"));
  const counts = {}; // playerId -> {count, leagues:[]}
  mine.forEach(m=>{
    (m.players||[]).forEach(pid=>{
      if(!counts[pid]) counts[pid]={count:0, leagues:[]};
      counts[pid].count++; counts[pid].leagues.push(m.leagueName);
    });
  });
  const rows = Object.entries(counts).filter(([,v])=>v.count>=1)
    .sort((a,b)=>b[1].count-a[1].count).slice(0,12);
  if(rows.length===0){ card.appendChild(el("p","muted","Load your rosters to see exposure.")); return card; }
  const total = mine.length || 1;
  rows.forEach(([pid,v])=>{
    const p = P(pid);
    const pct = Math.round(100*v.count/total);
    const item = el("div","list-item");
    item.innerHTML = `
      <span class="pos ${esc(p.pos)}">${esc(p.pos||'—')}</span>
      <div class="grow"><div class="nowrap" style="font-weight:600">${esc(p.name)}</div>
        <div class="bar" style="margin-top:5px;width:80%"><span style="width:${pct}%"></span></div></div>

        <div class="dim" style="font-size:11px">${pct}%</div></div>`;
    item.onclick=()=>openPlayer(pid);
    card.appendChild(item);
  });
  return card;
}

function renderPlayerList(){
  const wrap=$("#playerList"); if(!wrap) return;
  const q=playerFilter.q.trim().toLowerCase();
  const pos=playerFilter.pos;
  let results=[];
  const ply=APP.players||{};
  for(const id in ply){
    const p=ply[id];
    if(!p.position && !(p.fantasy_positions&&p.fantasy_positions.length)) continue;
    const pp=P(id);
    if(pos!=="ALL" && pp.pos!==pos) continue;
    if(q){
      const hay=(pp.name+" "+pp.team+" "+pp.pos).toLowerCase();
      if(!hay.includes(q)) continue;
    }
    // only fantasy-relevant + active-ish; require a team unless searching
    if(!q && (!pp.team || pp.team==="FA")) continue;
    results.push(pp);
    if(results.length>400) break;
  }
  // sort: has team first, then name
  results.sort((a,b)=> a.name.localeCompare(b.name));
  wrap.innerHTML="";
  if(results.length===0){ wrap.appendChild(el("p","empty","No players match.")); return; }
  const shown=results.slice(0,120);
  shown.forEach(p=>{
    const item=el("div","list-item");
    item.innerHTML=`<span class="pos ${esc(p.pos)}">${esc(p.pos||'—')}</span>
      <div class="grow"><div class="nowrap" style="font-weight:600">${esc(p.name)}
        ${p.inj?`<span class="inj" style="margin-left:5px">${esc(p.inj)}</span>`:''}</div>
        <div class="dim" style="font-size:12px">${esc(p.team)}${p.num?(' · #'+p.num):''}${p.exp!=null?(' · '+(p.exp===0?'Rookie':p.exp+'y')):''}</div></div>`;
    item.onclick=()=>openPlayer(p.id);
    wrap.appendChild(item);
  });
  if(results.length>shown.length){
    const more=el("div","dim"); more.style.cssText="text-align:center;padding:14px;font-size:12px";
    more.textContent=`Showing ${shown.length} of ${results.length}. Refine your search to narrow.`;
    wrap.appendChild(more);
  }
}

  const p=P(id); const raw=p.raw||{};
  const modal=openModal();

/* Heuristic "dynasty score": surfaces young, ascending, undervalued profiles.
   It is a candidate-finder from LIVE Sleeper data — not a ranking oracle.
   Pair it with the expert watchlist + your own eyes. */
function dynastyScore(p, trendCount, maxTrend){
  const pos = p.position;
  if(!["QB","RB","WR","TE"].includes(pos)) return null;
  if(!p.team || p.team === "FA") return null;
  const age = p.age; if(age == null) return null;
  const exp = p.years_exp;
  // youth: younger = better, plateau under 21
  const youth = Math.max(0, 27 - age) * 1.25;         // ~0..7.5
  // fantasy relevance sweet spot: some hype, not consensus elite (true sleepers)
  const sr = (p.search_rank && p.search_rank < 5000) ? p.search_rank : 5000;
  let rel;
  if(sr <= 12)      rel = 1.5;   // already a known star — not a sleeper
  else if(sr <= 50) rel = 5;     // ascending
  else if(sr <= 180) rel = 8;    // sweet spot
  else if(sr <= 400) rel = 5.5;
  else if(sr <= 900) rel = 3;
  else              rel = 1;
  // dynasty upside: reward early-career players
  const expScore = (exp != null && exp <= 3) ? (4 - exp) * 1.4 : 0; // rookie=5.6 ... 3yr=1.4
  // waiver momentum overlay
  const trend = trendCount ? (trendCount / maxTrend) * 4 : 0;
  return youth + rel + expScore + trend;
}

  PIT:{off:"Run-first, QB question",lean:-1,org:4}, SF:{off:"Shanahan zone, YAC-heavy",lean:0,org:5},
  SEA:{off:"Play-action, WR-friendly",lean:1,org:3}, TB:{off:"Pass-lean, balanced",lean:1,org:4},
  TEN:{off:"Rebuild, young QB",lean:0,org:2}, WAS:{off:"Dual-threat spread",lean:1,org:4},
};
function teamQBs(){
  if(APP.teamQB) return APP.teamQB;
  const m={};
  for(const id in (APP.players||{})){
    const p=APP.players[id];
    if(p.position!=="QB" || !p.team || p.team==="FA") continue;
    const order=p.depth_chart_order||99;
    const sr=(typeof p.search_rank==="number")?p.search_rank:9e9;
    const cand={name:(p.full_name||`${p.first_name||""} ${p.last_name||""}`).trim(), exp:p.years_exp, order, sr};
    const cur=m[p.team];
    if(!cur || cand.order<cur.order || (cand.order===cur.order && cand.sr<cur.sr)) m[p.team]=cand;
  }
  APP.teamQB=m; return m;
}
function qbGrade(qb){
  if(!qb) return {t:"Unsettled", s:8};
  const e=qb.exp;
  if(e==null) return {t:"Starter", s:16};
  if(e>=4) return {t:"Established", s:23};
  if(e>=2) return {t:"Ascending", s:18};
  return {t:"Young/unproven", s:13};
}
function gradeColor(l){ return l==="A"?"var(--green)":l==="B"?"var(--accent)":l==="C"?"var(--amber)":"var(--red)"; }
function situationGrade(pos, team, depthOrder, injury){
  const ctx=TEAM_CTX[team]; const qb=teamQBs()[team];
  const factors=[]; let score=0;
  const org=ctx?ctx.org:3;
  score += (org/5)*25;
  factors.push({k:"Franchise / coaching", v:"★".repeat(org)+"☆".repeat(5-org)});
  const qg=qbGrade(qb); score += qg.s;
  factors.push({k:"Quarterback", v: qb?`${qb.name} · ${qg.t}`:"Unsettled"});
  const lean=ctx?ctx.lean:0; let fit=12;
  if(pos==="RB") fit = lean<=-1?19 : lean>=1?9 : 14;
  else if(pos==="WR"||pos==="TE") fit = lean>=1?19 : lean<=-1?9 : 14;
  score += fit;
  factors.push({k:"Offense", v: ctx?ctx.off:"—"});
  let role=12;
  if(depthOrder===1) role=20; else if(depthOrder===2) role=12; else if(depthOrder>=3) role=6;
  score += role;
  factors.push({k:"Role", v: depthOrder?("#"+depthOrder+" on depth chart"):"—"});
  let inj=10, injTxt="Healthy";
  if(injury){ const s=String(injury).toLowerCase();
    if(/(out|ir|pup|susp|acl)/.test(s)){ inj=0; injTxt=injury; }
    else if(/(quest|doubt|day)/.test(s)){ inj=4; injTxt=injury; }
    else { inj=7; injTxt=injury; } }
  score += inj;
  factors.push({k:"Injury", v: injTxt});
  const letter = score>=85?"A":score>=75?"B":score>=65?"C":score>=55?"D":"F";
  return {letter, score:Math.round(score), factors};
}

  try{
    // 1) 2025 defensive strength = points allowed per game
    const st = await jget(`${ESPN_SITE}/v2/sports/football/nfl/standings?season=2025`);
    const pa={};
    (function walk(n){ if(!n||typeof n!=="object") return;
      if(n.standings && n.standings.entries){ n.standings.entries.forEach(e=>{
        const ab=e.team&&e.team.abbreviation; const stats=e.stats||[];
        const g=k=>{ const s=stats.find(x=>x.name===k||x.type===k||x.abbreviation===k); return s?(s.value!=null?s.value:parseFloat(s.displayValue)):null; };
        const paTot=g("pointsAgainst"), gp=g("gamesPlayed")||17;
        if(ab && paTot!=null) pa[ab]=paTot/gp;
      }); }
      (n.children||[]).forEach(walk);
    })(st);
    const abbrs=Object.keys(pa);
    if(abbrs.length>=20){
      const ranked=[...abbrs].sort((a,b)=>pa[a]-pa[b]);   // fewest PA/g = toughest D
      const defRank={}; ranked.forEach((a,i)=>defRank[a]=i+1);
      // 2) each team's 2026 opponents
      const teamsJson=await jget(`${ESPN_SITE}/site/v2/sports/football/nfl/teams`);
      const teamList=((((teamsJson.sports||[])[0]||{}).leagues||[])[0]||{}).teams||[];
      for(const w of teamList){
        const tm=w.team||w; const id=tm.id; const ab=tm.abbreviation; if(!id||!ab) continue;
        try{
          const sch=await jget(`${ESPN_SITE}/site/v2/sports/football/nfl/teams/${id}/schedule?season=2026`);
          const ranks=[];
          (sch.events||[]).forEach(ev=>{ const comp=(ev.competitions||[])[0]; if(!comp) return;
            const opp=(comp.competitors||[]).map(c=>c.team&&c.team.abbreviation).find(a=>a&&a!==ab);
            if(opp && defRank[opp]!=null) ranks.push(defRank[opp]);
          });
          if(ranks.length>=8){ sos[ab]={avg: ranks.reduce((s,x)=>s+x,0)/ranks.length, games:ranks.length}; }
        }catch(_){}
      }
      const vals=Object.values(sos).map(x=>x.avg);
      if(vals.length){ const mn=Math.min(...vals), mx=Math.max(...vals);
        Object.keys(sos).forEach(a=>{ const pct=mx>mn?(sos[a].avg-mn)/(mx-mn):0.5;
          sos[a].tier = pct>=0.62?"Easy":pct<=0.38?"Hard":"Average"; }); }
    }
  }catch(_){}
  APP.sos=sos; APP.sosLoaded=true; if(Object.keys(sos).length) cacheSet("sos2026", sos);
  return sos;
}
function sosFor(team){ const s=APP.sos&&APP.sos[team]; return s?s:null; }

/* ---- Sleeper-vs-market value gaps ----
   Sleeper side: search_rank (Sleeper's public market ordering ≈ Sleeper ADP).
   Market side: the player's rank on the live FantasyCalc dynasty board.
   delta = Sleeper rank − market rank.
     delta > 0 → Sleeper ranks him LATER than the market → falling = value/buy.
     delta < 0 → Sleeper ranks him EARLIER than the market → reach/overvalued. */
function buildSleeperRank(){
  if(APP.sleeperRank) return APP.sleeperRank;
  const rel=[];
  for(const id in APP.players){
    const p=APP.players[id];
    if(!["QB","RB","WR","TE"].includes(p.position)) continue;
    if(!p.team || p.team==="FA") continue;
    const sr=(typeof p.search_rank==="number" && p.search_rank>0 && p.search_rank<10000)?p.search_rank:null;
    if(sr==null) continue;
    rel.push({id, sr});
  }
  rel.sort((a,b)=>a.sr-b.sr);
  const map={}; rel.forEach((x,i)=>map[x.id]=i+1);
  APP.sleeperRank=map; return map;
}
function nameIndex(){
  if(APP.nameIdx) return APP.nameIdx;
  const idx={};
  for(const id in APP.players){
    const p=APP.players[id];
    const full=(p.full_name||`${p.first_name||""} ${p.last_name||""}`).toLowerCase().trim();
    if(full && !(full in idx)) idx[full]=id;
  }
  APP.nameIdx=idx; return idx;
}
function idForName(name){
  const idx=nameIndex(); const t=name.toLowerCase().trim();
  if(idx[t]) return idx[t];
  for(const k in idx){ if(k.includes(t)) return idx[k]; }
  return null;
}
function gapLabel(delta){
  const mag=Math.abs(delta);
  if(mag<3) return {txt:"≈ even", color:"var(--text3)", big:false};
  if(delta>0) return {txt:`🟢 value +${mag}`, color:mag>=8?"var(--green)":"var(--text2)", big:mag>=8};
  return {txt:`🔺 reach ${mag}`, color:mag>=8?"var(--red)":"var(--text2)", big:mag>=8};
}

/* ---- ESPN ranks import (paste) for a true Sleeper-vs-ESPN comparison ---- */
function parseEspnRanks(text){
  const map={}; const t=(text||"").trim(); if(!t) return map;
  try{
    const j=JSON.parse(t);
    const arr = j.players || (Array.isArray(j)?j:null);
    if(arr){
      arr.forEach(row=>{
        const pl=row.player||row;
        const name=pl.fullName||pl.name||row.fullName;
        let val=null;
        if(pl.draftRanksByRankType){ const r=pl.draftRanksByRankType.PPR||pl.draftRanksByRankType.STANDARD; if(r&&r.rank!=null) val=r.rank; }
        if(val==null && pl.ownership && pl.ownership.averageDraftPosition!=null) val=pl.ownership.averageDraftPosition;
        if(val==null && row.rank!=null) val=row.rank;
        if(val==null && row.adp!=null) val=row.adp;
        if(name && val!=null){ const k=normName(name); if(k) map[k]=Number(val); }
      });
      if(Object.keys(map).length) return map;
    }
  }catch(_){}
  // Plain-text fallback: one player per line with a rank/ADP number somewhere
  t.split(/\r?\n/).forEach(line=>{
    const s=line.trim(); if(!s) return;
    const numM=s.match(/(\d+(?:\.\d+)?)/);
    const nameRaw=s.replace(/[^A-Za-z .'’\-]/g," ").replace(/\s+/g," ").trim();
    const k=normName(nameRaw);
    if(numM && k && k.length>=4) map[k]=Number(numM[1]);
  });
  return map;
}

function renderEspnGapsInto(card, board, sRank){
  const espn=APP.espnRanks; const keys=Object.keys(espn||{});
  const rows=[];
  board.forEach(p=>{
    if(!p.sleeperId) return; const so=sRank[p.sleeperId]; if(!so) return;
    const bk=normName(p.name); let ev=espn[bk];
    if(ev==null){ const hit=keys.find(k=>k===bk || k.includes(bk) || bk.includes(k)); if(hit) ev=espn[hit]; }
    if(ev==null) return;
    rows.push({name:p.name, team:p.team, pos:p.pos, sleeperId:p.sleeperId, sVal:so, eVal:ev});
  });
  if(!rows.length){ card.appendChild(el("p","muted","No overlap yet — try pasting a fuller ESPN list (names must roughly match).")); return; }
  const byS=[...rows].sort((a,b)=>a.sVal-b.sVal); byS.forEach((r,i)=>r.sOrd=i+1);
  const byE=[...rows].sort((a,b)=>a.eVal-b.eVal); byE.forEach((r,i)=>r.eOrd=i+1);
  rows.forEach(r=>r.delta=r.sOrd-r.eOrd);  // <0 = higher on Sleeper; >0 = higher on ESPN
  const higherSleeper=rows.filter(r=>r.delta<0).sort((a,b)=>a.delta-b.delta).slice(0,15);
  const higherEspn   =rows.filter(r=>r.delta>0).sort((a,b)=>b.delta-a.delta).slice(0,15);
  card.appendChild(el("p","muted",`<span style="font-size:12px;display:block;margin:6px 0 2px">${rows.length} players matched. Gap = spots higher on one platform vs the other.</span>`));
  const sec=(title,arr,color)=>{ const g=el("div"); g.style.marginTop="8px"; g.appendChild(el("div","section-title",title));
    if(!arr.length){ g.appendChild(el("p","dim","None.")); return g; }
    arr.forEach(r=>{ const it=el("div","list-item"); it.style.padding="6px 0";
      it.innerHTML=`<span class="pos ${esc(r.pos)}">${esc(r.pos||'—')}</span>
        <div class="grow"><div class="nowrap" style="font-weight:600">${esc(r.name)} <span class="dim" style="font-size:11px">${esc(r.team)}</span></div>
          <div class="dim" style="font-size:11px">Sleeper #${r.sOrd} · ESPN #${r.eOrd}</div></div>
        <div style="text-align:right;font-weight:800;font-size:12px;color:${color}">▲ ${Math.abs(r.delta)}</div>`;
      it.onclick=()=>openPlayer(r.sleeperId); g.appendChild(it); });
    return g; };
  card.appendChild(sec("🔴 Higher on Sleeper — cheaper on ESPN (get them later there)", higherSleeper, "var(--red)"));
  card.appendChild(sec("🔵 Higher on ESPN — cheaper on Sleeper (get them later there)", higherEspn, "var(--blue)"));
}

        .map(p=>{ const a=ppg(s25,p.sleeperId), b=ppg(s24,p.sleeperId);

          const score=(a||0)+(delta!=null?delta*1.5:0)+(p.age?Math.max(0,24-p.age)*0.8:0);
          return Object.assign({}, p, {a, b, delta, score}); })
        .filter(p=>p.a!=null && p.a>=6)
        .sort((x,y)=>y.score-x.score).slice(0,18);
    } else {
      asc = board
        .filter(p=>p.sleeperId && ["WR","RB","TE"].includes(p.pos))
        .map(p=>{ const a=ppg(s25,p.sleeperId), b=ppg(s24,p.sleeperId);
          const delta=(a!=null&&b!=null)?a-b:null;
          const sp=APP.players?APP.players[p.sleeperId]:null;
          const score=(a||0)*1.2 + (delta!=null?(delta>0?delta*1.0:delta*0.5):0) + gradeBonus(p.pos,p.team,sp)*1.2;
          return Object.assign({}, p, {a, b, delta, score}); })
        .filter(p=>p.a!=null && p.a>=5)
        .sort((x,y)=>y.score-x.score).slice(0,18);
    }
    const ascCard=el("div","card"); ascCard.style.marginTop="12px";
    ascCard.innerHTML=`<h2>${md==="dynasty"?"Ascending — breakout comps for 2026":"Rising into 2026 — breakout &amp; bounce-back watch"}</h2>
      <p class="muted" style="font-size:12px;margin:-6px 0 8px">${md==="dynasty"?"Young, rising producers ranked by 2025 PPG + year-over-year jump + youth.":"Ranked by 2025 PPG + rising trend + situation grade — age-agnostic."} Tap for a profile.</p>`;
    if(!asc.length) ascCard.appendChild(el("p","muted","Historical stats didn't return usable production."));
    asc.forEach((p,i)=>{
      const it=el("div","list-item");
      it.innerHTML=`<span class="dim" style="width:20px;font-weight:800">${i+1}</span>
        <span class="pos ${esc(p.pos)}">${esc(p.pos)}</span>
        <div class="grow"><div class="nowrap" style="font-weight:600">${esc(p.name)} <span class="dim" style="font-size:11px">${esc(p.team)}${p.age?` · ${p.age}y`:''}</span></div>
          <div style="font-size:11px;margin-top:2px">${trendArrow(p.a,p.b)}</div></div>`;
      it.onclick=()=>{ if(APP.playersLoaded&&p.sleeperId) openPlayer(p.sleeperId); else openPlayerByName(p.name); };
      ascCard.appendChild(it);
    });
    c.appendChild(ascCard);

    // Top board 2-year trajectory
    const trajCard=el("div","card"); trajCard.style.marginTop="12px";
    trajCard.innerHTML=`<h2>Top board · 2-year trajectory</h2>
      <p class="muted" style="font-size:12px;margin:-6px 0 8px">Who's rising vs. ${md==="dynasty"?"aging out":"fading"} among the top 24.</p>`;
    board.slice(0,24).filter(p=>p.sleeperId).forEach(p=>{
      const a=ppg(s25,p.sleeperId), b=ppg(s24,p.sleeperId);
      const it=el("div","list-item"); it.style.padding="7px 0";
      it.innerHTML=`<span class="dim" style="width:24px;font-weight:800">${p.rank}</span>
        <span class="pos ${esc(p.pos)}">${esc(p.pos)}</span>
        <div class="grow nowrap" style="font-weight:600">${esc(p.name)}</div>
        <div style="font-size:11px;text-align:right">${trendArrow(a,b)}</div>`;
      it.onclick=()=>{ if(APP.playersLoaded&&p.sleeperId) openPlayer(p.sleeperId); else openPlayerByName(p.name); };
      trajCard.appendChild(it);
    });
    c.appendChild(trajCard);
  }).catch(e=>{ c.innerHTML=""; const w=el("div","warn");
    w.innerHTML="Couldn't load historical stats (needs network). "+esc(e.message||e); c.appendChild(w); });
}

function pickNo(round, slot, teams, snake){
  if(snake && round%2===0) return (round-1)*teams + (teams - slot + 1);
  return (round-1)*teams + slot;
}
const PLAN_STRAT = {
  dynasty:[
    [1,2,"Young WR cornerstones — WR+WR is the PPR ideal."],
    [3,4,"Best young WR/RB + the top rookies. Inject youth."],
    [5,6,"A young franchise QB at value, or an elite young TE if he slides."],
    [7,9,"Year-2 breakouts and high-upside young WRs — your league-winners."],
    [10,99,"Rookies, handcuffs to your young RBs, and lottery darts."],
  ],
  redraft:[
    [1,2,"Best available — an elite RB or WR with floor + ceiling."],
    [3,5,"Fill your starting WR/RB; take an elite TE only at value."],
    [6,8,"Lock your QB1 and add high-upside flex pieces."],
    [9,12,"RB handcuffs, WR depth, and upside swings."],
    [13,99,"Late upside stashes, then stream DST/K."],
  ],
};
function roundStrat(md, round){ const arr=PLAN_STRAT[md]||PLAN_STRAT.dynasty;
  const f=arr.find(([lo,hi])=>round>=lo && round<=hi); return f?f[2]:""; }

function renderTrade(c){
  c.innerHTML='<div class="spinner"></div>';
  loadFCBoard().then(board=>{
    c.innerHTML="";
    const md=mode();
    const bySid={}; board.forEach(p=>{ if(p.sleeperId) bySid[p.sleeperId]=p; });
    const refresh=arr=>arr.forEach(p=>{ const b=p.sleeperId&&bySid[p.sleeperId]; if(b){ p.value=b.value; p.rank=b.rank; } });
    refresh(tradeA); refresh(tradeB);

    const note=el("div","warn");
    if(APP.fcFallback) note.innerHTML="<b>Live trade values unavailable</b> — FantasyCalc's feed isn't reachable from your browser right now, so exact values can't load. Try again in a bit.";
    else note.innerHTML=`<b>Trade Analyzer</b> — live <b>${md==="dynasty"?"dynasty":"standard PPR"}</b> market values (FantasyCalc, current). Add players to each side; winner + margin update instantly. This uses the live market, not my memory.`;
    c.appendChild(note);

    const sw=el("div","search-wrap");
    sw.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="tq" placeholder="Search a player to add…">`;
    c.appendChild(sw);
    const res=el("div"); res.id="tres"; c.appendChild(res);

    const sides=el("div","grid2"); sides.style.marginTop="4px";
    const colA=el("div","card"), colB=el("div","card"); sides.append(colA,colB); c.appendChild(sides);
    const verdict=el("div","card"); c.appendChild(verdict);
    const sum=arr=>arr.reduce((s,p)=>s+(p.value||0),0);

    function renderSides(){
      const drawCol=(col,arr,label)=>{
        col.innerHTML=`<div class="spread" style="margin-bottom:6px"><h2 style="margin:0;font-size:12px">${label}</h2><span class="chip">${num(sum(arr),0)}</span></div>`;
        if(!arr.length){ col.appendChild(el("p","dim","<span style='font-size:12px'>empty</span>")); return; }
        arr.forEach((p,i)=>{ const it=el("div","list-item"); it.style.padding="6px 0";
          it.innerHTML=`<span class="pos ${esc(p.pos)}">${esc(p.pos)}</span>
            <div class="grow" style="font-weight:600;font-size:12px">${esc(p.name)} <span class="dim" style="font-size:10px">${esc(p.team)} · ${p.value!=null?num(p.value,0):'—'}</span></div>`;
          const rm=el("button","chip","✕"); rm.onclick=()=>{ arr.splice(i,1); renderSides(); };
          it.appendChild(rm); col.appendChild(it); });
      };
      drawCol(colA,tradeA,"YOU GET"); drawCol(colB,tradeB,"YOU GIVE");
      const a=sum(tradeA), b=sum(tradeB), diff=a-b, tot=Math.max(a,b,1), pct=Math.round(Math.abs(diff)/tot*100);
      let msg,color;
      if(!tradeA.length||!tradeB.length){ msg="Add players to both sides."; color="var(--text2)"; }
      else if(Math.abs(diff)/tot<0.05){ msg=`⚖️ Even trade (within ${pct}%). Fair for both.`; color="var(--text)"; }
      else if(diff>0){ msg=`✅ You WIN by ${num(diff,0)} (${pct}%) — accept.`; color="var(--green)"; }
      else { msg=`❌ You LOSE by ${num(-diff,0)} (${pct}%) — decline / counter.`; color="var(--red)"; }
      verdict.innerHTML=`<h2>Verdict</h2><div style="font-weight:800;font-size:16px;color:${color};line-height:1.4">${msg}</div>
        <div class="muted" style="font-size:12px;margin-top:6px">Get ${num(a,0)} · Give ${num(b,0)} · ${md==="dynasty"?"dynasty":"standard PPR"} values</div>`;
    }
    function renderRes(q){ res.innerHTML=""; if(!q) return;
      const ql=q.toLowerCase();
      board.filter(p=>p.name.toLowerCase().includes(ql)).slice(0,8).forEach(p=>{
        const it=el("div","list-item"); it.style.padding="7px 0";
        it.innerHTML=`<span class="pos ${esc(p.pos)}">${esc(p.pos)}</span>
          <div class="grow" style="font-weight:600;font-size:13px">${esc(p.name)} <span class="dim" style="font-size:11px">${esc(p.team)} · ${p.value!=null?num(p.value,0):'—'}</span></div>`;
        const ga=el("button","btn","+ Get"); ga.style.cssText="padding:5px 9px;font-size:12px";
        ga.onclick=()=>{ tradeA.push(Object.assign({},p)); res.innerHTML=""; $("#tq").value=""; renderSides(); };
        const gv=el("button","btn","+ Give"); gv.style.cssText="padding:5px 9px;font-size:12px;margin-left:5px";
        gv.onclick=()=>{ tradeB.push(Object.assign({},p)); res.innerHTML=""; $("#tq").value=""; renderSides(); };
        it.append(ga,gv); res.appendChild(it);
      });
    }
    $("#tq").addEventListener("input",e=>renderRes(e.target.value.trim()));
    if(tradeA.length||tradeB.length){ const clr=el("button","btn ghost wide","Clear trade"); clr.style.cssText="margin-top:6px;color:var(--text3);font-size:12px";
      clr.onclick=()=>{ tradeA=[]; tradeB=[]; renderDynastySub(); }; c.appendChild(clr); }
    renderSides();
  }).catch(e=>{ c.innerHTML=""; c.appendChild(errorCard(e)); });
}

async function refreshLive(c){
  try{
    const [draft, picks] = await Promise.all([ Sleeper.draft(cfg.draftId), Sleeper.draftPicks(cfg.draftId).catch(()=>[]) ]);
    const board = await loadFCBoard();
    await ensurePlayers().catch(()=>{});
    const teams  = (draft.settings&&draft.settings.teams) || Object.keys(draft.draft_order||{}).length || 12;
    const rounds = (draft.settings&&draft.settings.rounds) || 15;
    const snake  = (draft.type||"snake")==="snake";
    const drafted = new Set((picks||[]).map(p=>String(p.player_id)));
    const avail = board.filter(p=>p.sleeperId && !drafted.has(p.sleeperId));
    const pickNoNow = (picks?picks.length:0)+1;
    const roundNow  = Math.ceil(pickNoNow/teams);
    const mySlot = (draft.draft_order && cfg.sleeperUserId) ? draft.draft_order[cfg.sleeperUserId] : null;
    let myNext=null, picksAway=null;
    if(mySlot){ for(let r=roundNow;r<=rounds;r++){ const pn=pickNo(r,mySlot,teams,snake); if(pn>=pickNoNow){ myNext={round:r,pn}; picksAway=pn-pickNoNow; break; } } }
    const idx=(pickNoNow-1)%teams;
    const onClockSlot=(snake && roundNow%2===0)?(teams-idx):(idx+1);
    const myTurn = mySlot && onClockSlot===mySlot && draft.status==="drafting";

    c.innerHTML="";
    const head=el("div","card");
    head.innerHTML=`<div class="spread" style="margin-bottom:8px">
      <b style="font-size:16px">${esc((draft.metadata&&draft.metadata.name)||"Live Draft")}</b>
      <span class="chip">${esc(draft.status)}</span></div>
      <div class="grid3">
        <div class="stat"><div class="n">${draft.status==="complete"?"—":"#"+pickNoNow}</div><div class="l">On clock</div></div>
        <div class="stat"><div class="n">R${roundNow}</div><div class="l">Round</div></div>
        <div class="stat"><div class="n">${myNext?("#"+myNext.pn):"—"}</div><div class="l">Your next</div></div>
      </div>`;
    c.appendChild(head);

    if(draft.status==="complete"){ const d=el("div","warn"); d.innerHTML="This draft is <b>complete</b>."; c.appendChild(d); }
    else if(myTurn){
      const t=el("div","card"); t.style.border="1px solid var(--accent)";
      t.innerHTML=`<h2 style="color:var(--accent);margin-bottom:8px">🟢 You're on the clock</h2>`;
      avail.slice(0,3).forEach((rec,i)=>{ const it=el("div","list-item"); it.style.cssText=i===0?"background:var(--bg3);border-radius:10px;padding:10px":"padding:7px 0";
        it.innerHTML=`<span class="pos ${esc(rec.pos)}">${esc(rec.pos)}</span>
          <div class="grow"><div style="font-weight:${i===0?800:600}">${esc(rec.name)} <span class="dim" style="font-size:11px">${esc(rec.team)}</span></div>
            ${i===0?'<div class="chip" style="color:var(--accent);margin-top:3px">TOP AVAILABLE · #'+rec.rank+'</div>':''}</div>
          ${i>0?`<span class="dim" style="font-size:11px">#${rec.rank}</span>`:''}`;
        it.onclick=()=>openBoardPlayer(rec); t.appendChild(it); });
      c.appendChild(t);
    } else if(myNext){ const w=el("div","warn"); w.innerHTML=`Your next pick is <b>#${myNext.pn}</b> (round ${myNext.round}) — <b>${picksAway}</b> pick${picksAway===1?"":"s"} away.`; c.appendChild(w); }

    // best available
    const baCard=el("div","card");
    baCard.innerHTML=`<div class="spread"><h2 style="margin:0">Best available</h2><span class="chip">${avail.length} left</span></div>`;
    const tabs=el("div","tabs"); tabs.style.marginTop="8px";
    const list=el("div");
    function renderBA(posF){ list.innerHTML="";
      avail.filter(p=>posF==="ALL"||p.pos===posF).slice(0,25).forEach(p=>{
        const it=el("div","list-item"); it.style.padding="7px 0"; const adpv=adpFor(p.name);
        it.innerHTML=`<span class="dim" style="width:26px;font-weight:800">${p.rank}</span>
          <span class="pos ${esc(p.pos)}">${esc(p.pos)}</span>
          <div class="grow" style="font-weight:600">${esc(p.name)} <span class="dim" style="font-size:11px">${esc(p.team)}${adpv!=null?` · ADP ${num(adpv,1)}`:''}</span></div>`;
        it.onclick=()=>openBoardPlayer(p); list.appendChild(it);
      });
    }
    ["ALL","QB","RB","WR","TE"].forEach((pos,i)=>{ const b=el("button",i===0?"active":"",pos);
      b.onclick=()=>{ tabs.querySelectorAll("button").forEach(x=>x.classList.remove("active")); b.classList.add("active"); renderBA(pos); };
      tabs.appendChild(b); });
    baCard.appendChild(tabs); baCard.appendChild(list); renderBA("ALL");
    c.appendChild(baCard);

    // recent picks
    if((picks||[]).length){
      const rp=el("div","card"); rp.innerHTML=`<h2>Recent picks</h2>`;
      picks.slice(-8).reverse().forEach(pk=>{ const pl=P(String(pk.player_id));
        const it=el("div","list-item"); it.style.padding="6px 0";
        it.innerHTML=`<span class="dim" style="width:34px;font-weight:800">${pk.pick_no}</span>
          <span class="pos ${esc(pl.pos)}">${esc(pl.pos||'—')}</span>
          <div class="grow" style="font-weight:600">${esc(pl.name)} <span class="dim" style="font-size:11px">${esc(pl.team)}</span></div>`;
        rp.appendChild(it); });
      c.appendChild(rp);
    }

    const foot=el("button","btn ghost wide", draft.status==="drafting"?"↻ Live · auto-refreshing (tap to change draft)":"Change draft");
    foot.style.marginTop="4px"; foot.style.color="var(--text3)"; foot.style.fontSize="12px";
    foot.onclick=()=>{ clearDraftTimer(); cfg.draftId=""; saveCfg(); renderDynastySub(); };
    c.appendChild(foot);

    clearDraftTimer();
    if(draft.status==="drafting" && dynastyTab==="live" && APP.view==="dynasty"){
      APP.draftTimer=setInterval(()=>{ if(dynastyTab==="live" && APP.view==="dynasty") refreshLive(c); else clearDraftTimer(); }, 6000);
    }
  }catch(e){ clearDraftTimer(); c.innerHTML=""; const w=errorCard(e);
    const chg=el("button","btn wide","Change / re-enter draft ID"); chg.style.marginTop="10px";
    chg.onclick=()=>{ cfg.draftId=""; saveCfg(); renderDynastySub(); }; w.appendChild(chg);
    c.appendChild(w); }
}

/* ============================================================
   VIEW: This Week — live PPR start/sit analyzer
   Everything is pulled live in the browser each time you open it:
   - Sleeper weekly projections   api.sleeper.app/projections/nfl/{season}/{week}
   - Sleeper weekly actual stats  api.sleeper.app/stats/nfl/{season}/{week}
     (recent form, snap %, target share, defense-vs-position)
   - ESPN scoreboard              opponent, kickoff, Vegas spread/total
   - Sleeper player injury tags   (from the projection feed, so they're fresh)
   ============================================================ */
const SLEEPER_ROOT = "https://api.sleeper.app";
const WK_POS = ["QB","RB","WR","TE","K","DEF"];
const WK_POS_QS = WK_POS.map(p=>"position[]="+p).join("&");
const PPR_RULES = {pass_yd:.04,pass_td:4,pass_int:-2,pass_2pt:2,rush_yd:.1,rush_td:6,rush_2pt:2,
  rec:1,rec_yd:.1,rec_td:6,rec_2pt:2,fum_lost:-2};
const ESPN_TO_SLEEPER = {WSH:"WAS"};
const START_LINE = {QB:12,RB:24,WR:30,TE:12,K:12,DEF:12};
const FLEX_LINE  = {QB:18,RB:36,WR:45,TE:18,K:16,DEF:16};
const SLOT_OK = {QB:["QB"],RB:["RB"],WR:["WR"],TE:["TE"],K:["K"],DEF:["DEF"],
  FLEX:["RB","WR","TE"],WRRB_FLEX:["RB","WR"],REC_FLEX:["WR","TE"],SUPER_FLEX:["QB","RB","WR","TE"]};
const SLOT_ORDER = ["QB","RB","WR","TE","K","DEF","WRRB_FLEX","REC_FLEX","FLEX","SUPER_FLEX"];

function pprPts(s){
  if(!s) return null;
  if(typeof s.pts_ppr==="number") return s.pts_ppr;
  let t=0, any=false;
  for(const k in PPR_RULES){ if(typeof s[k]==="number"){ t+=s[k]*PPR_RULES[k]; any=true; } }
  return any ? t : null;
}
/* League-exact points for skill players (K/DEF use Sleeper's own PPR calc) */
function leaguePts(s, scoring, pos){
  if(!s) return null;
  if(!scoring || pos==="K" || pos==="DEF") return pprPts(s);
  let t=0, any=false;
  for(const k in scoring){ if(typeof s[k]==="number" && typeof scoring[k]==="number"){ t+=s[k]*scoring[k]; any=true; } }
  const prem = scoring["bonus_rec_"+String(pos).toLowerCase()];   // TE/RB/WR reception premiums
  if(prem && typeof s.rec==="number") t+=s.rec*prem;
  return any ? t : pprPts(s);
}
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const avg = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : null;
const sd = a => { if(a.length<2) return null; const m=avg(a); return Math.sqrt(avg(a.map(x=>(x-m)*(x-m)))); };

/* IndexedDB cache with TTL, so completed weeks aren't re-downloaded */
async function idbCached(key, maxAgeMs, loader, force){
  if(!force){
    try{ const c=await IDB.get(key); if(c && c.t && Date.now()-c.t < maxAgeMs) return c.v; }catch(_){}
  }
  try{
    const v = await loader();
    try{ await IDB.set(key, {t:Date.now(), v}); }catch(_){}
    return v;
  }catch(e){
    try{ const c=await IDB.get(key); if(c) return c.v; }catch(_){}  // stale beats nothing
    throw e;
  }
}

/* Sleeper weekly feed -> {pid: {pid, pos, team, opp, stats, name, inj}} */
function normWeekRows(data){
  const out={};
  if(Array.isArray(data)){
    data.forEach(r=>{
      if(!r || !r.player_id) return;
      const pl=r.player||{};
      const pos=pl.position || (pl.fantasy_positions&&pl.fantasy_positions[0]) || (APP.players&&APP.players[r.player_id]&&APP.players[r.player_id].position) || (/^[A-Z]{2,3}$/.test(r.player_id)?"DEF":"");
      const row={pid:r.player_id, pos, team:r.team||pl.team||"", opp:r.opponent||"", stats:r.stats||{},
        name: pl.first_name ? `${pl.first_name} ${pl.last_name||""}`.trim() : "", inj: pl.injury_status||""};
      const prev=out[r.player_id];
      if(!prev || (pprPts(row.stats)||0) > (pprPts(prev.stats)||0)) out[r.player_id]=row;
    });
  } else if(data && typeof data==="object"){
    Object.keys(data).forEach(pid=>{
      const p=APP.players&&APP.players[pid];
      out[pid]={pid, pos:(p&&p.position)||(/^[A-Z]{2,3}$/.test(pid)?"DEF":""), team:(p&&p.team)||"", opp:"", stats:data[pid]||{}, name:"", inj:""};
    });
  }
  return out;
}

async function fetchProjections(season, week, force){
  return idbCached(`wk_proj_${season}_${week}`, 20*60e3, async()=>normWeekRows(
    await jget(`${SLEEPER_ROOT}/projections/nfl/${season}/${week}?season_type=regular&${WK_POS_QS}&order_by=pts_ppr`)), force);
}
async function fetchWeekStats(season, week, ageMs, force){
  return idbCached(`wk_stats_${season}_${week}`, ageMs, async()=>{
    try{ return normWeekRows(await jget(`${SLEEPER_ROOT}/stats/nfl/${season}/${week}?season_type=regular&${WK_POS_QS}`)); }
    catch(_){ return normWeekRows(await jget(`${SLEEPER}/stats/nfl/regular/${season}/${week}`)); }
  }, force);
}
/* ESPN scoreboard -> {team: {opp, home, kickoff, state, spread, total, implied, oppImplied}} */
async function fetchSchedule(season, week, ageMs, force){
  return idbCached(`wk_sched_${season}_${week}`, ageMs, async()=>{
    const d = await jget(`${ESPN_SITE}/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=${week}&dates=${season}`);
    const out={};
    (d.events||[]).forEach(ev=>{
      const c=(ev.competitions||[])[0]; if(!c) return;
      const teams=(c.competitors||[]).map(t=>({ab:ESPN_TO_SLEEPER[t.team&&t.team.abbreviation]||(t.team&&t.team.abbreviation), home:t.homeAway==="home", score:+t.score||0}));
      if(teams.length!==2) return;
      const o=(c.odds||[])[0]||null;
      let total=o&&typeof o.overUnder==="number"?o.overUnder:null, fav=null, line=null;
      if(o && o.details){
        const m=String(o.details).match(/^([A-Z]{2,4})\s*(-?\d+(\.\d+)?)/);
        if(m){ fav=ESPN_TO_SLEEPER[m[1]]||m[1]; line=Math.abs(parseFloat(m[2])); }
        else if(/even|pk/i.test(o.details)){ line=0; }
      }
      if(line==null && o && typeof o.spread==="number"){
        line=Math.abs(o.spread);
        const h=teams.find(t=>t.home), a=teams.find(t=>!t.home);
        fav = (o.homeTeamOdds&&o.homeTeamOdds.favorite) ? h.ab : (o.awayTeamOdds&&o.awayTeamOdds.favorite) ? a.ab : (o.spread<0?h.ab:a.ab);
      }
      const st=(c.status||ev.status||{}).type||{};
      teams.forEach((t,i)=>{
        const op=teams[1-i];
        let implied=null;
        if(total!=null && line!=null){ implied = total/2 + (fav===t.ab? line/2 : -line/2); }
        out[t.ab]={opp:op.ab, home:t.home, kickoff:c.date||ev.date, state:st.state||"pre", detail:st.shortDetail||"",
          score:t.score, oppScore:op.score, spread: line==null?null:(fav===t.ab?-line:line), total, implied,
          oppImplied: (total!=null&&implied!=null)? total-implied : null};
      });
    });
    return out;
  }, force);
}

/* Build the whole week model */
async function buildWeekModel(season, week, force){
  const prior=[]; for(let w=Math.max(1,week-17); w<week; w++) prior.push(w);
  const recent=prior.slice(-1)[0];
  const [proj, sched, ...past] = await Promise.all([
    fetchProjections(season, week, force),
    fetchSchedule(season, week, 15*60e3, force).catch(()=>({})),
    ...prior.map(w=>Promise.all([
      fetchWeekStats(season, w, w===recent?6*3600e3:7*24*3600e3, force && w===recent).catch(()=>({})),
      fetchSchedule(season, w, w===recent?6*3600e3:30*24*3600e3, force && w===recent).catch(()=>({})),
    ])),
  ]);

  // --- per-player history + defense-vs-position ---
  const hist={};           // pid -> [{w, pts, snap, tgtShare, opps}]
  const dvpRaw={};         // def -> pos -> {pts, weeks:Set}
  past.forEach(([rows, sch], i)=>{
    const w=prior[i];
    const teamTgt={};
    Object.values(rows).forEach(r=>{ if(r.team && r.stats.rec_tgt) teamTgt[r.team]=(teamTgt[r.team]||0)+r.stats.rec_tgt; });
    Object.values(rows).forEach(r=>{
      const s=r.stats, pts=pprPts(s);
      const played = (s.gp>0) || (s.off_snp>0) || (pts!=null && pts!==0);
      if(!played || pts==null) return;
      const pos=r.pos; if(!WK_POS.includes(pos)) return;
      const team=r.team || (APP.players&&APP.players[r.pid]&&APP.players[r.pid].team) || "";
      const opp = r.opp || (sch[team]&&sch[team].opp) || "";
      (hist[r.pid]=hist[r.pid]||[]).push({w, pts,
        snap: (s.off_snp && s.tm_off_snp) ? s.off_snp/s.tm_off_snp : null,
        tgtShare: (s.rec_tgt!=null && teamTgt[team]) ? s.rec_tgt/teamTgt[team] : null,
        opps: (s.rec_tgt||0) + (s.rush_att||0)});
      if(opp){ const d=(dvpRaw[opp]=dvpRaw[opp]||{}); const e=(d[pos]=d[pos]||{pts:0,weeks:new Set()}); e.pts+=pts; e.weeks.add(w); }
    });
  });
  const dvp={}; // pos -> {def: {avg, rank}} ; rank 1 = toughest, 32 = easiest
  const dvpLg={};
  WK_POS.forEach(pos=>{
    const arr=Object.keys(dvpRaw).filter(d=>dvpRaw[d][pos]&&dvpRaw[d][pos].weeks.size).map(d=>({d, avg:dvpRaw[d][pos].pts/dvpRaw[d][pos].weeks.size}));
    arr.sort((a,b)=>a.avg-b.avg);
    dvp[pos]={}; arr.forEach((x,i)=>dvp[pos][x.d]={avg:x.avg, rank:i+1, of:arr.length});
    dvpLg[pos]=avg(arr.map(x=>x.avg));
  });

  const impliedAll=Object.values(sched).map(g=>g.implied).filter(x=>x!=null);
  const lgImplied=avg(impliedAll) || 22.5;
  const schedLoaded=Object.keys(sched).length>=8;

  // --- candidate pool: everyone projected + anyone with recent history ---
  const pids=new Set(Object.keys(proj));
  Object.keys(hist).forEach(pid=>{ if(hist[pid].some(h=>h.w>=week-3)) pids.add(pid); });

  const players={};
  pids.forEach(pid=>{
    const pr=proj[pid], base=P(pid);
    const pos=(pr&&pr.pos)||base.pos; if(!WK_POS.includes(pos)) return;
    const team=(base.raw&&base.raw.team)||(pr&&pr.team)||base.team||"";
    if(!team || team==="FA") return;
    const h=(hist[pid]||[]).sort((a,b)=>a.w-b.w);
    const l3=h.slice(-3);
    players[pid]={pid, pos, team, name:base.name!==pid?base.name:((pr&&pr.name)||pid),
      inj:(pr&&pr.inj)||base.inj||"", projStats:pr?pr.stats:null,
      g:sched[team]||null, bye: schedLoaded && !sched[team],
      hist:h, l3:avg(l3.map(x=>x.pts)), season:avg(h.map(x=>x.pts)), games:h.length,
      sdev:sd(h.map(x=>x.pts)),
      snap:avg(l3.map(x=>x.snap).filter(x=>x!=null)), tgt:avg(l3.map(x=>x.tgtShare).filter(x=>x!=null)),
      opps:avg(l3.map(x=>x.opps))};
  });

  const M={season, week, players, dvp, dvpLg, sched, lgImplied, schedLoaded, prior,
    projCount:Object.keys(proj).length, fetchedAt:Date.now()};
  rescore(M, null);
  return M;
}

/* Turn raw inputs into an adjusted projection, with the reasoning attached */
function scorePlayer(M, p, scoring){
  const why=[];
  const projPts = p.projStats ? leaguePts(p.projStats, scoring, p.pos) : null;
  let base = projPts;
  if(base==null && p.l3!=null){ base=p.l3*0.85; why.push("No projection posted — using 85% of last-3 average"); }
  if(base==null) base=0;
  const form = p.l3!=null ? p.l3 : p.season;
  let v = (form!=null && p.games>=2) ? 0.75*base + 0.25*form : base;
  if(form!=null && projPts!=null && p.games>=2){
    const d=form-projPts;
    if(Math.abs(d)>=3) why.push(`Recent form ${d>0?"running hot":"cooling"}: ${num(form,1)} PPR over last ${Math.min(3,p.games)} vs ${num(projPts,1)} projected`);
  }
  // matchup (defense vs position)
  let mf=1, mInfo=null;
  if(p.g && M.dvp[p.pos] && M.dvp[p.pos][p.g.opp] && M.dvpLg[p.pos]){
    mInfo=M.dvp[p.pos][p.g.opp];
    mf = 1 + (clamp(mInfo.avg/M.dvpLg[p.pos], 0.75, 1.25)-1)*0.5;
    if(mInfo.rank>=mInfo.of-7) why.push(`Soft matchup: ${p.g.opp} allows the ${ordinal(mInfo.of-mInfo.rank+1)}-most PPR pts to ${p.pos} (${num(mInfo.avg,1)}/g)`);
    else if(mInfo.rank<=8) why.push(`Tough matchup: ${p.g.opp} allows the ${ordinal(mInfo.rank)}-fewest PPR pts to ${p.pos} (${num(mInfo.avg,1)}/g)`);
  }
  // Vegas
  let vf=1;
  if(p.g && p.g.implied!=null){
    if(p.pos==="DEF"){ vf = 1 - clamp((p.g.oppImplied-M.lgImplied)/M.lgImplied,-.3,.3)*0.6; }
    else { vf = 1 + clamp((p.g.implied-M.lgImplied)/M.lgImplied,-.3,.3)*0.35; }
    if(p.pos!=="DEF" && p.g.implied>=M.lgImplied+3.5) why.push(`High-scoring spot: team implied for ${num(p.g.implied,1)} pts`);
    if(p.pos!=="DEF" && p.g.implied<=M.lgImplied-4) why.push(`Low team total: implied for only ${num(p.g.implied,1)} pts`);
    if(p.pos==="DEF" && p.g.oppImplied<=M.lgImplied-3) why.push(`Opponent implied for just ${num(p.g.oppImplied,1)} pts`);
  }
  // availability
  let inf=1; const inj=(p.inj||"").toLowerCase();
  if(p.bye){ inf=0; why.unshift("BYE week"); }
  else if(/^(out|ir|pup|sus|na|cov|dnr)/.test(inj)){ inf=0; why.unshift(`Listed ${p.inj} — do not start`); }
  else if(inj.startsWith("doubt")){ inf=0.25; why.unshift("Doubtful — very likely inactive"); }
  else if(inj.startsWith("ques")){ inf=0.9; why.unshift("Questionable — check inactives ~90 min before kickoff"); }
  // usage notes
  if(p.snap!=null && p.snap<0.45 && ["RB","WR","TE"].includes(p.pos)) why.push(`Part-time role: ${Math.round(p.snap*100)}% snaps last 3`);
  if(p.tgt!=null && p.tgt>=0.24) why.push(`Elite target share: ${Math.round(p.tgt*100)}% last 3`);
  const adj = v*mf*vf*inf;
  const spread = p.sdev!=null ? p.sdev : Math.max(3, adj*0.4);
  return {proj:projPts, adj, floor:Math.max(0,adj-spread*0.8), ceil:adj+spread*1.1, mf, vf, inf, mInfo, why};
}
function ordinal(n){ const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }

function rescore(M, scoring){
  Object.values(M.players).forEach(p=>{ Object.assign(p, scorePlayer(M,p,scoring)); });
  WK_POS.forEach(pos=>{
    const arr=Object.values(M.players).filter(p=>p.pos===pos).sort((a,b)=>b.adj-a.adj);
    arr.forEach((p,i)=>{ p.rank=i+1;
      p.tier = p.adj<=0.05 ? "Sit" : i < Math.ceil(START_LINE[pos]/3) ? "Must Start" : i < START_LINE[pos] ? "Start" : i < FLEX_LINE[pos] ? "Flex" : "Sit";
    });
  });
}
const TIER_COLOR={"Must Start":"var(--green)","Start":"var(--accent)","Flex":"var(--amber)","Sit":"var(--red)"};
function tierTag(t){ return `<span class="tag" style="border:1px solid ${TIER_COLOR[t]};color:${TIER_COLOR[t]}">${esc(t)}</span>`; }
function matchupTag(p){
  if(!p.mInfo) return "";
  const r=p.mInfo.rank, of=p.mInfo.of, c = r>=of-7?"var(--green)":r<=8?"var(--red)":"var(--text2)";
  return `<span class="chip" style="color:${c}">vs ${esc(p.g.opp)} ${p.pos} D: ${ordinal(of-r+1)} easiest</span>`;
}
function gameLine(p){
  if(p.bye) return `<span class="dim">BYE</span>`;
  if(!p.g) return `<span class="dim">${esc(p.team)}</span>`;
  const k=new Date(p.g.kickoff);
  const when = p.g.state==="pre" ? k.toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"}) :
               p.g.state==="in" ? `<b style="color:var(--amber)">LIVE ${esc(p.g.detail)}</b>` : `Final ${p.g.score}-${p.g.oppScore}`;
  return `${esc(p.team)} ${p.g.home?"vs":"@"} ${esc(p.g.opp)} · ${when}`;
}

function wkPlayerRow(p, opts={}){
  const item=el("div","list-item");
  const trend = (p.l3!=null && p.season!=null && p.games>=4) ? (p.l3>p.season*1.12?'<span class="trend-up">↑</span>':p.l3<p.season*0.88?'<span class="trend-down">↓</span>':"") : "";
  const usage = [p.snap!=null&&p.pos!=="K"&&p.pos!=="DEF"?`Snap ${Math.round(p.snap*100)}%`:"", p.tgt!=null&&["WR","TE","RB"].includes(p.pos)?`Tgt ${Math.round(p.tgt*100)}%`:""].filter(Boolean).join(" · ");
  item.innerHTML=`${opts.rank!==false?`<span class="dim" style="width:22px;font-weight:800;font-size:12px">${opts.n||p.rank}</span>`:""}
    <span class="pos ${esc(opts.slot||p.pos)}">${esc(opts.slot?slotLabel(opts.slot):p.pos)}</span>
    <div class="grow"><div class="nowrap" style="font-weight:700">${esc(p.name)} ${p.inj?`<span class="inj">${esc(p.inj.slice(0,4).toUpperCase())}</span>`:""}</div>
      <div class="dim nowrap" style="font-size:11px">${gameLine(p)}</div>
      <div class="muted nowrap" style="font-size:11px;margin-top:2px">Proj ${num(p.proj,1)} · L3 ${num(p.l3,1)}${trend}${usage?" · "+usage:""}</div></div>
    <div style="text-align:right;flex-shrink:0"><div style="font-size:18px;font-weight:800">${num(p.adj,1)}</div>
      <div style="margin-top:2px">${tierTag(p.tier)}</div></div>`;
  item.onclick=()=>wkPlayerModal(p);
  return item;
}
function slotLabel(s){ return ({SUPER_FLEX:"SFLX",WRRB_FLEX:"W/R",REC_FLEX:"W/T"})[s]||s; }

function wkPlayerModal(p){
  const m=openModal();
  const recent=p.hist.slice(-6).map(h=>`<span class="chip">W${h.w} ${num(h.pts,1)}</span>`).join(" ");
  m.body.innerHTML=`<div class="row" style="margin-bottom:12px"><img class="avatar lg" src="${Sleeper.playerImg(p.pid)}" onerror="this.style.visibility='hidden'">
      <div class="grow"><div style="font-size:18px;font-weight:800">${esc(p.name)}</div>
      <div class="muted" style="font-size:13px"><span class="pos ${esc(p.pos)}">${esc(p.pos)}</span> ${p.pos}${p.rank} this week · ${gameLine(p)}</div></div></div>
    <div class="grid3" style="margin-bottom:12px">

/* Optimal lineup for one roster under the league's slots */
function optimizeLineup(M, slots, rosterPids){
  const used=new Set(), out=[];
  const pool=rosterPids.map(id=>M.players[id]).filter(Boolean);
  const idx=slots.map((s,i)=>({s,i})).filter(x=>SLOT_OK[x.s]);
  idx.sort((a,b)=>SLOT_ORDER.indexOf(a.s)-SLOT_ORDER.indexOf(b.s));
  idx.forEach(({s,i})=>{
    const best=pool.filter(p=>!used.has(p.pid) && SLOT_OK[s].includes(p.pos)).sort((a,b)=>b.adj-a.adj)[0];
    if(best){ used.add(best.pid); }
    out[i]=best||null;
  });
  return out;
}
function winProb(a,b){ const z=(a-b)/Math.max(12, 0.18*(a+b)); return 1/(1+Math.exp(-1.7*z)); }

async function wkLineups(c, M){

    const slots=(L.info.roster_positions||[]).filter(s=>!["BN","IR","TAXI"].includes(s));
    const mu=(L.matchups||[]).find(m=>m.roster_id===r.roster_id);

    const roster=[...new Set([...(r.players||[]), ...curStart])].filter(id=>id && id!=="0");

    const ptsOf=arr=>arr.reduce((s,p)=>s+(p?p.adj:0),0);

    const recPPR = scoring&&scoring.rec!=null ? (scoring.rec===1?"PPR":scoring.rec===0.5?"Half-PPR":scoring.rec===0?"Standard":scoring.rec+" PPR") : "PPR";
    card.innerHTML=`<h2>${esc(L.info.name)} <span class="dim" style="text-transform:none;letter-spacing:0">· ${esc(recPPR)} scoring</span></h2>`;
    // head-to-head
    if(mu){
      const opp=(L.matchups||[]).find(m=>m.matchup_id===mu.matchup_id && m.roster_id!==r.roster_id);
      if(opp){
        const or=L.rosters.find(x=>x.roster_id===opp.roster_id)||{};
        const oStart=(opp.starters&&opp.starters.length?opp.starters:(or.starters||[]));
        const oPts=slots.reduce((s,_,i)=>s+((M.players[oStart[i]]||{}).adj||0),0);

      }
    }
    // swaps
    const curSet=new Set(cur.filter(Boolean).map(p=>p.pid)), bestSet=new Set(best.filter(Boolean).map(p=>p.pid));
    const ins=best.filter(p=>p&&!curSet.has(p.pid)), outs=cur.filter(p=>p&&!bestSet.has(p.pid));

      const sw=el("div"); sw.style.cssText="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.3);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px";

        ins.map((p,i)=>`<div style="margin-top:5px">▲ Start <b>${esc(p.name)}</b> (${num(p.adj,1)})${outs[i]?` over ${esc(outs[i].name)} (${num(outs[i].adj,1)})`:" in empty slot"}</div>`).join("");
      card.appendChild(sw);

    card.appendChild(el("div","section-title","Optimal lineup")).style.marginTop="12px";
    slots.forEach((s,i)=>{ if(!SLOT_OK[s]) return; const p=best[i];

    if(bench.length){ card.appendChild(el("div","section-title","Bench")).style.marginTop="12px"; bench.forEach(p=>card.appendChild(wkPlayerRow(p,{slot:"BN",rank:false}))); }
    c.appendChild(card);
  });
  rescore(M,null);
  if(!c.children.length) c.appendChild(el("p","muted","Couldn't find your rosters in the synced leagues."));
